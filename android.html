<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>REVOC - Downloads</title>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1605727281913-50d4268b0cdd?q=80&w=2070') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 30px;
            margin: 0;
            min-height: 100vh;
            background-color: #000;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ÉCLAIRS TOMBANTS --- */
        .bolt-particle {
            position: fixed;
            top: -50px;
            color: #00d4ff;
            font-size: 24px;
            text-shadow: 0 0 10px #00d4ff, 0 0 20px #fff;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallAnimation linear infinite;
        }
        @keyframes fallAnimation {
            0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(5px) scale(1.2); opacity: 0; }
        }

        .header-title {
            color: #fff; 
            font-size: 50px; 
            font-weight: 900;
            font-style: italic;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            z-index: 10;
        }

        /* --- SECTIONS --- */
        .section-name {
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 5px;
            width: 80%;
            max-width: 420px;
            text-align: left;
            z-index: 10;
        }

        .link {
            width: 85%; 
            max-width: 420px;
            padding: 15px 20px; 
            margin: 8px;
            border: 2px solid rgba(0, 212, 255, 0.4); 
            border-radius: 18px;
            color: white;
            text-decoration: none; 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(12px);
            transition: all 0.3s ease;
            display: flex; 
            align-items: center; 
            z-index: 10;
            position: relative;
        }

        .link:hover { 
            background: rgba(0, 212, 255, 0.2); 
            transform: scale(1.05);
            border-color: #fff;
        }

        .btn-icon {
            width: 45px; height: 45px;
            border-radius: 10px;
            object-fit: cover;
            position: absolute;
            left: 15px;
        }

        .btn-text-container {
            flex: 1; 
            text-align: center;
        }

        .btn-title { display: block; font-size: 16px; font-weight: bold; }
        .subtitle { color: #00d4ff; font-size: 11px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="bolt-particle" style="left: 15%; animation-duration: 3s;">⚡</div>
    <div class="bolt-particle" style="left: 50%; animation-duration: 4s;">⚡</div>
    <div class="bolt-particle" style="left: 85%; animation-duration: 2.5s;">⚡</div>

    <div class="header-title">REVOC</div>

    <div class="section-name">📺 𝐓𝐕 / 𝐈𝐩𝐭𝐯</div>
    
    <a class="link" href="liens/youbox.apk" download="YouBoxTV.apk">
        <img src="logo_youbox.png" class="btn-icon" alt=" ">
        <div class="btn-text-container">
            <span class="btn-title">YOUBOX TV</span>
            <span class="subtitle">⚡ Télécharger ⚡</span>
        </div>
    </a>

    <a class="link" href="liens/atlas.apk" download="AtlasProX9.apk">
        <img src="téléchargement.png" class="btn-icon" alt=" ">
        <div class="btn-text-container">
            <span class="btn-title">ATLAS PRO X9</span>
            <span class="subtitle">⚡ Télécharger ⚡</span>
        </div>
    </a>

    <div class="section-name">🛠️ Appli Tool</div>

    <a class="link" href="liens/tool1.apk" download="Outil1.apk">
        <img src="unnamedreer.png" class="btn-icon" alt=" ">
        <div class="btn-text-container">
            <span class="btn-title">CLEANER TOOL</span>
            <span class="subtitle">⚡ Télécharger ⚡</span>
        </div>
    </a>

    <a class="link" href="liens/streamflix.apk" download="Streamflix.apk">
        <img src="unnamedreer-Photoroom.png" class="btn-icon" alt=" ">
        <div class="btn-text-container">
            <span class="btn-title">STREAMFLIX TOOL</span>
            <span class="subtitle">⚡ Télécharger ⚡</span>
        </div>

</body>
</html>
